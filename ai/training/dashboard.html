<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mob Training</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #1c2230; --muted: #687184; --line: #e2e5ec; --soft: #f0f2f6;
  --accent: #3b6fd8; --raw: rgba(59, 111, 216, 0.13); --second: #d0702a; --good: #1f9254; --bad: #c8433a; --target: #98a1b3;
  --change: #7a52c7; --rewind: #c8433a; --restart: #a3abbb;
  --wipe: #2f9e63; --cleared: #c8564b; --timeout: #9aa3b5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101319; --panel: #191e27; --ink: #e5e8ee; --muted: #8b94a5; --line: #29303c; --soft: #20262f;
    --accent: #6f9cf5; --raw: rgba(111, 156, 245, 0.15); --second: #f0a05a; --good: #4cc489; --bad: #f07a70; --target: #5d6677;
    --change: #b493f5; --rewind: #f07a70; --restart: #555e6e;
    --wipe: #4cc489; --cleared: #e2776c; --timeout: #636c7d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 17px; margin: 0; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.pill.running { color: var(--good); } .pill.stale { color: var(--bad); } .pill.stopped { color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; flex: 1; }
.stat { white-space: nowrap; }
.stat b { font-size: 15px; } .stat span { color: var(--muted); font-size: 12px; margin-right: 4px; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
#grid { display: grid; gap: 10px; padding: 10px; min-height: 0; overflow: auto; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; display: flex; flex-direction: column; min-height: 0; position: relative; }
.chart h2 { font-size: 13.5px; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.chart h2 .name { cursor: help; }
.chart .now { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: crosshair; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px 14px 20px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
aside h3:first-child { margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
td { padding: 3px 0; border-bottom: 1px solid var(--soft); }
td.num { text-align: right; white-space: nowrap; padding-left: 8px; }
.change { display: grid; grid-template-columns: 22px 1fr; gap: 6px; margin-bottom: 8px; font-size: 12.5px; }
.badge { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--change); }
.badge.rewind { background: var(--rewind); } .badge.restart { background: var(--restart); }
.change .when { color: var(--muted); font-size: 11.5px; }
.change .detail { color: var(--muted); }
.worker { display: grid; grid-template-columns: 34px 1fr 58px 44px; gap: 6px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; margin: 2px 0; }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.worker.stale .bar i { background: var(--bad); } .worker.stale { color: var(--bad); }
.note { color: var(--muted); font-size: 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 8px; border-radius: 6px; display: none; max-width: 340px; }
.tip b { display: block; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: center; justify-content: center; z-index: 5; }
#modal .chart { width: min(92vw, 1800px); height: min(82vh, 1000px); }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } body { height: auto; } }
</style>
</head>
<body>
<header>
  <h1>Mob training</h1>
  <span class="pill" id="state">Loading…</span>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <div class="seg" id="range"><button data-v="1">1 h</button><button data-v="6">6 h</button><button data-v="24">24 h</button><button data-v="0">All</button></div>
    <div class="seg" id="axis"><button data-v="samples">Decisions</button><button data-v="t">Time</button></div>
    <div class="seg" id="smooth" title="Moving-average strength"><button data-v="60">Low</button><button data-v="25">Med</button><button data-v="10">High</button></div>
    <div class="seg" id="focus" title="Since last change: the scale fits training since the newest numbered change, and earlier training is shown in grey for context. Everything: the whole range on one scale."><button data-v="change">Since last change</button><button data-v="all">Everything</button></div>
  </div>
</header>
<div class="layout">
  <section id="grid"></section>
  <aside id="side"></aside>
</div>
<div id="modal"></div>
<div class="tip" id="tip"></div>
<script>
const CHARTS = [
  {key: "wipe_rate", title: "Party wiped", hint: "Share of episodes where mobs down the whole party. Should rise.", pct: true, better: 1},
  {key: "explore_found_rate", title: "Party found (explore starts)", hint: "Share of explore episodes where a mob sees a player. Should rise.", pct: true, better: 1},
  {key: "explore_first_sight_s", title: "Time to find the party", hint: "Seconds until the first mob sees a player, when found. Should fall.", unit: " s", better: -1},
  {key: "damage_to_party", title: "Damage to the party", hint: "Health taken by the party per episode (a player has about 100). Should rise.", better: 1},
  {key: "life_return", title: "Mob reward per life", hint: "Total reward a mob earns over its life. The main score; should rise. Reward changes shift its level.", better: 1},
  {key: "outcomes", title: "How fights end", hint: "Green: mobs wiped the party. Red: the party cleared the mobs. Grey: time limit.", stack: ["wipe", "cleared", "timeout"], pct: true, better: 0},
  {key: "entropy", title: "Entropy (variety of choices)", hint: "How random the mobs' choices are. Blue: fighting choices (behaviour, targets, manoeuvre), measured from the 'Locked choices' fixes on only over decisions where the mob is free to choose (not committed to a hold or wind-up); it falls slowly as mobs settle on good choices, and a fast drop toward 0.5 is a warning. Orange: the two message choices, which start fully random and fall as messages gain meaning. Grey: the average over all decisions, the only line logged before the split.", lines: [["entropy_fight", "--accent"], ["entropy_messages", "--second"], ["entropy", "--restart"]], better: 0},
  {key: "entropy_heads", title: "Entropy by choice", hint: "Each choice's entropy where it has more than one option (logged from the phase 1 fixes on), so a change in the summed fighting entropy can be traced to its choice. Blue: behaviour. Orange: enemy target. Purple: hold length. Green: manoeuvre. Grey: ally target.", lines: [["entropy_behaviour", "--accent"], ["entropy_enemy_target", "--second"], ["entropy_commit", "--change"], ["entropy_manoeuvre", "--good"], ["entropy_ally_target", "--restart"]], better: 0},
  {key: "commit_set_share", title: "Hold length chosen", hint: "Of the positioning decisions where a mob chooses how long to commit: blue, the share that chose a set length instead of the usual hold; orange, the share that chose 2 s or more.", lines: [["commit_set_share", "--accent"], ["commit_long_share", "--second"]], pct: true, better: 0},
  {key: "approx_kl", title: "Policy change per update (KL)", hint: "How much each update changes the mobs' choices. Should stay below 0.015 (dashed).", target: 0.015, digits: 4, better: 0},
  {key: "learning_rate", title: "Learning rate", hint: "Lowered automatically if the KL goes above its limit.", digits: 5, better: 0},
  {key: "clip_fraction", title: "Clip fraction", hint: "Share of choices PPO held back from changing too far. Under 0.2 is healthy.", digits: 3, better: 0},
  {key: "value_loss", title: "Critic error (value loss)", hint: "How well the critic predicts rewards. Should stay small and steady; jumps after reward changes are normal.", digits: 4, better: 0},
  {key: "explained_variance", title: "Critic accuracy (explained variance)", hint: "How much of what mobs go on to earn the critic predicts: 1 is perfect, 0 is no better than the average. Above 0.3 (dashed) is healthy; low means mobs learn from noise. Logged from Rewards v3 on.", target: 0.3, digits: 3, better: 1},
];
const SUMMARY_NAMES = {wipe_rate: ["Party wiped", 1, true], explore_found_rate: ["Party found", 1, true], explore_first_sight_s: ["Time to find (s)", -1],
  damage_to_party: ["Damage to party", 1], life_return: ["Mob reward / life", 1], entropy: ["Entropy", 0], approx_kl: ["KL", 0, false, 4], explained_variance: ["Critic accuracy", 1, false, 3], speed: ["Decisions / s", 1, false, 0]};
const grid = document.getElementById("grid");
const tip = document.getElementById("tip");
const modal = document.getElementById("modal");
let data = null, hoverX = null, frame = 0;
const prefs = load();

function load() {
  try { return Object.assign({hours: 0, axis: "samples", smooth: 25, focus: "change"}, JSON.parse(localStorage.getItem("mob-dashboard") || "{}")); }
  catch (error) { return {hours: 0, axis: "samples", smooth: 25, focus: "change"}; }
}
function save() { try { localStorage.setItem("mob-dashboard", JSON.stringify(prefs)); } catch (error) { /* private mode */ } }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fmt(spec, v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  if (spec.pct) return (v * 100).toFixed(1) + "%";
  if (spec.digits !== undefined) return v.toFixed(spec.digits) + (spec.unit || "");
  return (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2)) + (spec.unit || "");
}
function millions(n) { return n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + "M"; }
function clock(t) { const d = new Date(t * 1000); return d.toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}); }
function age(seconds) {
  if (seconds === null || seconds === undefined) return "–";
  if (seconds < 90) return Math.round(seconds) + " s";
  if (seconds < 5400) return Math.round(seconds / 60) + " min";
  return (seconds / 3600).toFixed(1) + " h";
}
// The moving average restarts at each numbered change, so a jump in level is not smeared across it.
function smooth(values, span, era) {
  const out = [];
  for (let i = 0; i < values.length; i++) {
    let sum = 0, count = 0;
    for (let j = Math.max(0, i - span + 1); j <= i; j++) if (values[j] !== null && era[j] === era[i]) { sum += values[j]; count++; }
    out.push(count ? sum / count : null);
  }
  return out;
}
function changeMarks() {
  return data.changes.filter(m => m.kind === "change").map(m => prefs.axis === "t" ? m.t : m.samples).sort((a, b) => a - b);
}
// Where "Since last change" starts: the newest numbered change with some training after it, or null.
function focusStart(points) {
  if (prefs.focus !== "change" || points.length < 2) return null;
  const first = points[0][prefs.axis], last = points[points.length - 1][prefs.axis];
  const marks = changeMarks().filter(at => at > first && at < last);
  if (!marks.length) return null;
  const at = marks[marks.length - 1];
  return points.filter(p => p[prefs.axis] >= at).length >= 2 ? at : null;
}
// The points a chart shows. In focus the dashboard script already sends training since the change plus a short
// stretch before it for context.
function shownPoints() {
  const points = data.points;
  return {points, focus: focusStart(points)};
}

const charts = CHARTS.map(spec => {
  const box = document.createElement("div");
  box.className = "chart";
  box.innerHTML = `<h2><span class="name" title="${spec.hint}">${spec.title}</span><span class="now"></span></h2><canvas></canvas>`;
  grid.appendChild(box);
  const chart = {spec, box, canvas: box.querySelector("canvas"), now: box.querySelector(".now")};
  chart.canvas.addEventListener("mousemove", e => hover(chart, e));
  chart.canvas.addEventListener("mouseleave", () => { hoverX = null; tip.style.display = "none"; redraw(); });
  chart.canvas.addEventListener("click", () => openModal(chart));
  return chart;
});
const big = {spec: null, box: null, canvas: null, now: null};

function openModal(chart) {
  modal.innerHTML = `<div class="chart"><h2><span>${chart.spec.title}</span><span class="now"></span></h2><div class="note">${chart.spec.hint} Click anywhere or press Esc to close.</div><canvas></canvas></div>`;
  big.spec = chart.spec; big.box = modal.firstChild; big.canvas = modal.querySelector("canvas"); big.now = modal.querySelector(".now");
  big.canvas.addEventListener("mousemove", e => hover(big, e));
  big.canvas.addEventListener("mouseleave", () => { hoverX = null; tip.style.display = "none"; redraw(); });
  modal.style.display = "flex";
  redraw();
}
function closeModal() { modal.style.display = "none"; big.spec = null; redraw(); }
modal.addEventListener("click", closeModal);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function layout() {
  const width = grid.clientWidth, height = grid.clientHeight;
  const cols = width >= 1900 ? 4 : width >= 1250 ? 3 : width >= 700 ? 2 : 1;
  const rows = Math.ceil(CHARTS.length / cols);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  const fit = window.innerWidth > 1100 ? Math.floor((height - 20 - 10 * (rows - 1)) / rows) : 0;
  grid.style.gridAutoRows = (fit >= 190 ? fit : 240) + "px";
}

function xs(points) { return points.map(p => p[prefs.axis]); }

function draw(chart) {
  if (!chart.canvas || !data) return;
  const {spec, canvas} = chart;
  const {points, focus} = shownPoints();
  const ratio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (width < 10 || height < 10) return;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const g = canvas.getContext("2d");
  g.scale(ratio, ratio);
  g.clearRect(0, 0, width, height);
  const keys = spec.stack || (spec.lines ? spec.lines.map(l => l[0]) : [spec.key]);
  const x = xs(points);
  const series = keys.map(k => points.map(p => (p[k] === undefined ? null : p[k])));
  const marks = changeMarks();
  const era = x.map(v => marks.filter(at => at <= v).length);
  const recent = x.map(v => focus === null || v >= focus);
  const span = Math.max(2, Math.round(recent.filter(Boolean).length / prefs.smooth));
  const smoothed = series.map(s => smooth(s, span, era));
  chart.layout = null;
  // In focus the scale fits only training since the change; earlier values may run off the chart.
  const values = (spec.stack ? [0, 1] : series.flatMap(s => s.filter((v, j) => v !== null && recent[j]))).concat(spec.target ? [spec.target] : []);
  if (points.length < 2 || values.length === 0) {
    g.fillStyle = css("--muted"); g.font = "12px system-ui"; g.fillText("No data in this range yet", 8, 20);
    chart.now.textContent = "";
    return;
  }
  let lo = Math.min(...values), hi = Math.max(...values);
  if (spec.pct || spec.key === "speed") lo = Math.min(lo, 0);
  if (hi - lo < 1e-12) { const room = Math.max(Math.abs(hi) * 0.1, 1e-6); hi += room; lo -= spec.pct ? 0 : room; }
  const pad = {l: 52, r: 10, t: 16, b: 22};
  const x0 = x[0], x1 = x[x.length - 1];
  const X = v => pad.l + (v - x0) / Math.max(1e-9, x1 - x0) * (width - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (height - pad.t - pad.b);
  g.lineWidth = 1; g.font = "11px system-ui";
  g.strokeStyle = css("--line"); g.fillStyle = css("--muted");
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(width - pad.r, y); g.stroke();
    g.fillText(fmt(spec, v), 4, y + 4);
  }
  const label = v => prefs.axis === "t" ? clock(v) : millions(v);
  for (let i = 0; i <= 3; i++) {
    const v = x0 + (x1 - x0) * i / 3, text = label(v), w = g.measureText(text).width;
    g.fillText(text, Math.min(width - pad.r - w, Math.max(pad.l, X(v) - w / 2)), height - 6);
  }
  if (spec.target) {
    g.setLineDash([5, 4]); g.strokeStyle = css("--target");
    g.beginPath(); g.moveTo(pad.l, Y(spec.target)); g.lineTo(width - pad.r, Y(spec.target)); g.stroke(); g.setLineDash([]);
  }
  // Changes, restarts and resumes, under the lines.
  for (const mark of data.changes) {
    const at = prefs.axis === "t" ? mark.t : mark.samples;
    if (at < x0 || at > x1) continue;
    const px = X(at);
    g.strokeStyle = css(mark.kind === "change" ? "--change" : mark.kind === "rewind" ? "--rewind" : "--restart");
    g.setLineDash(mark.kind === "restart" ? [2, 4] : [6, 4]); g.lineWidth = mark.kind === "restart" ? 1 : 1.5;
    g.beginPath(); g.moveTo(px, pad.t); g.lineTo(px, height - pad.b); g.stroke(); g.setLineDash([]); g.lineWidth = 1;
    if (mark.kind !== "restart") {
      g.fillStyle = g.strokeStyle;
      g.beginPath(); g.arc(px, 8, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fff"; g.font = "bold 10px system-ui"; g.textAlign = "center";
      g.fillText(mark.kind === "rewind" ? "↺" : String(mark.number), px, 11.5); g.textAlign = "left"; g.font = "11px system-ui";
    }
  }
  // Checkpoints along the bottom.
  g.fillStyle = css("--muted");
  for (const c of data.checkpoints) {
    let best = null;
    for (const p of points) if (p.version !== null && p.version <= c.version) best = p;
    if (!best || best === points[0]) continue;
    const px = X(best[prefs.axis]), size = c.milestone ? 7 : 4;
    g.beginPath(); g.moveTo(px, height - pad.b); g.lineTo(px - size / 2, height - pad.b + size); g.lineTo(px + size / 2, height - pad.b + size); g.fill();
  }
  const path = (s, colour, lineWidth) => {
    g.strokeStyle = colour; g.lineWidth = lineWidth; g.beginPath();
    let started = false;
    s.forEach((v, j) => { if (v === null || (j > 0 && era[j] !== era[j - 1])) started = false; if (v === null) return;
      const px = X(x[j]), py = Y(v); started ? g.lineTo(px, py) : g.moveTo(px, py); started = true; });
    g.stroke();
  };
  // Draws the series inside a clip: grey before the focus change, in colour after it.
  const plot = (left, right, grey) => {
    g.save(); g.beginPath(); g.rect(left, pad.t, right - left, height - pad.t - pad.b); g.clip();
    if (spec.stack) {
      const colours = ["--wipe", "--cleared", "--timeout"].map(css);
      let base = x.map(() => 0);
      smoothed.forEach((s, i) => {
        const top = s.map((v, j) => base[j] + (v || 0));
        g.fillStyle = colours[i]; g.globalAlpha = grey ? 0.22 : 0.75; g.beginPath();
        top.forEach((v, j) => j ? g.lineTo(X(x[j]), Y(v)) : g.moveTo(X(x[j]), Y(v)));
        for (let j = base.length - 1; j >= 0; j--) g.lineTo(X(x[j]), Y(base[j]));
        g.closePath(); g.fill(); g.globalAlpha = 1;
        base = top;
      });
    } else if (spec.lines) {
      spec.lines.forEach(([_key, colour], i) => {
        g.globalAlpha = grey ? 0.1 : 0.15; path(series[i], grey ? css("--restart") : css(colour), 1);
        g.globalAlpha = grey ? 0.6 : 1; path(smoothed[i], grey ? css("--restart") : css(colour), i === spec.lines.length - 1 ? 1.25 : 2);
        g.globalAlpha = 1;
      });
    } else {
      path(series[0], grey ? "rgba(128, 136, 150, 0.18)" : css("--raw"), 1);
      path(smoothed[0], grey ? css("--restart") : css("--accent"), 2);
    }
    g.restore();
  };
  if (focus === null) {
    plot(pad.l, width - pad.r, false);
  } else {
    plot(pad.l, X(focus), true);
    plot(X(focus), width - pad.r, false);
  }
  // The value now, or at the pointer, with its trend over the visible range.
  let index = smoothed[0].length - 1;
  if (hoverX !== null) {
    let best = Infinity;
    x.forEach((v, j) => { const d = Math.abs(v - hoverX); if (d < best) { best = d; index = j; } });
    g.strokeStyle = css("--muted"); g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(X(x[index]), pad.t); g.lineTo(X(x[index]), height - pad.b); g.stroke(); g.setLineDash([]);
    smoothed.forEach((s, i) => { if (s[index] === null) return; const stackBase = spec.stack ? smoothed.slice(0, i).reduce((a, t) => a + (t[index] || 0), 0) : 0;
      g.fillStyle = spec.stack ? css(["--wipe", "--cleared", "--timeout"][i]) : spec.lines ? css(spec.lines[i][1]) : css("--accent"); g.beginPath(); g.arc(X(x[index]), Y(stackBase + s[index]), 3.5, 0, Math.PI * 2); g.fill(); });
  }
  const value = smoothed.map(s => s[index]);
  let trend = "";
  if (hoverX === null && !spec.stack && !spec.lines) {
    const sm = smoothed[0].filter((v, j) => v !== null && recent[j]);
    const earlier = sm[Math.max(0, Math.floor(sm.length * 0.75) - 1)], last = sm[sm.length - 1];
    if (sm.length > 4) {
      const change = last - earlier, scale = Math.max(1e-12, hi - lo);
      let cls = "flat", arrow = "→";
      if (Math.abs(change) / scale > 0.03) { arrow = change > 0 ? "↑" : "↓"; if (spec.better) cls = (change > 0) === (spec.better > 0) ? "up" : "down"; }
      trend = `<span class="${cls}">${arrow}</span> `;
    }
  }
  chart.now.innerHTML = trend + (spec.stack ? value.map(v => fmt(spec, v)).join(" / ") :
    spec.lines ? spec.lines.map(([_key, colour], i) => `<span style="color:${css(colour)}">${fmt(spec, value[i])}</span>`).join(" / ") : fmt(spec, value[0]));
  chart.layout = {X, x, index, pad, width, points};
}

function redraw() {
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(() => { charts.forEach(draw); if (big.spec) draw(big); });
}

function hover(chart, event) {
  const l = chart.layout;
  if (!l) return;
  const rect = chart.canvas.getBoundingClientRect();
  const px = event.clientX - rect.left;
  const x = l.x, frac = Math.min(1, Math.max(0, (px - l.pad.l) / (l.width - l.pad.l - l.pad.r)));
  hoverX = x[0] + frac * (x[x.length - 1] - x[0]);
  redraw();
  let index = 0, best = Infinity;
  x.forEach((v, j) => { const d = Math.abs(v - hoverX); if (d < best) { best = d; index = j; } });
  const p = l.points[index];
  let near = "";
  for (const mark of data.changes) {
    const at = prefs.axis === "t" ? mark.t : mark.samples;
    if (Math.abs(l.X(at) - px) < 8) near += `<b>${mark.number ? mark.number + ". " : ""}${mark.title}</b>${mark.detail}<br>`;
  }
  tip.innerHTML = near + `${millions(p.samples)} decisions · policy ${p.version} · ${p.time}`;
  tip.style.display = "block";
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, event.clientX + 14) + "px";
  tip.style.top = (event.clientY + 16) + "px";
}

function side() {
  const s = data.summary, rows = [];
  for (const [key, [name, better, pct, digits]] of Object.entries(SUMMARY_NAMES)) {
    const spec = {pct, digits};
    const now = s[key] ? s[key].now : null, before = s[key] ? s[key].before : null;
    let arrow = "";
    if (now !== null && before !== null && before !== undefined) {
      const change = now - before, rel = Math.abs(change) / Math.max(1e-9, Math.abs(before));
      if (rel > 0.03) arrow = `<span class="${better === 0 ? "flat" : (change > 0) === (better > 0) ? "up" : "down"}">${change > 0 ? "↑" : "↓"}</span>`;
      else arrow = `<span class="flat">→</span>`;
    }
    rows.push(`<tr><td>${name}</td><td class="num">${fmt(spec, now)}</td><td class="num">${fmt(spec, before)}</td><td class="num">${arrow}</td></tr>`);
  }
  const pace = data.pace || {};
  const changes = data.changes.slice().reverse().map(m => `<div class="change"><span class="badge ${m.kind}">${m.kind === "change" ? m.number : m.kind === "rewind" ? "↺" : "·"}</span>` +
    `<div><b>${m.title}</b> <span class="when">${clock(m.t)} · ${millions(m.samples)}</span><div class="detail">${m.detail}</div></div></div>`).join("");
  const fastest = Math.max(1, ...data.workers.map(w => w.rows_per_second || 0));
  const workers = data.workers.map(w => {
    const stale = w.age !== null && w.age > 300;
    return `<div class="worker${stale ? " stale" : ""}"><span>w${String(w.worker).padStart(2, "0")}</span><span class="bar"><i style="width:${Math.round(100 * (w.rows_per_second || 0) / fastest)}%"></i></span>` +
      `<span style="text-align:right">${Math.round(w.rows_per_second || 0).toLocaleString()}/s</span><span style="text-align:right">${age(w.age)}</span></div>`;
  }).join("");
  const latest = data.checkpoints.filter(c => !c.milestone).pop();
  const milestones = data.checkpoints.filter(c => c.milestone).length;
  document.getElementById("side").innerHTML =
    `<h3>Last hour of training vs the hour before</h3><table><tr><td></td><td class="num note">last hour</td><td class="num note">before</td><td></td></tr>${rows.join("")}</table>` +
    `<h3>Pace</h3><div>${pace.per_hour ? millions(pace.per_hour) + " decisions per hour" : "–"}</div>` +
    (pace.next ? `<div class="note">${millions(pace.next)} decisions in about ${age(pace.eta_hours * 3600)}</div>` : "") +
    `<h3>Changes and restarts</h3>${changes || '<div class="note">None yet</div>'}` +
    `<h3>Checkpoints</h3><div>${latest ? `Latest: policy ${latest.version}, ${age(latest.age)} ago` : "None yet"}</div><div class="note">${milestones} milestone${milestones === 1 ? "" : "s"} kept for later opponents</div>` +
    `<h3>Workers (decisions/s, last report)</h3>${workers || '<div class="note">No worker reports yet</div>'}`;
}

function header() {
  const t = data.trainer || {};
  let state = "Stopped", cls = "stopped";
  if (t.state && t.state !== "stopped") {
    if (data.heartbeat_age !== null && data.heartbeat_age < 180) { state = "Training"; cls = "running"; }
    else { state = "No response from the trainer"; cls = "stale"; }
  }
  if (data.stop_requested && cls === "running") state = "Stopping";
  const el = document.getElementById("state");
  el.textContent = state + " · " + data.host; el.className = "pill " + cls;
  const speed = data.workers.reduce((sum, w) => sum + (w.rows_per_second || 0), 0);
  const stat = (label, value) => `<div class="stat"><span>${label}</span><b>${value}</b></div>`;
  document.getElementById("stats").innerHTML = [
    stat("Decisions", t.samples !== undefined ? millions(t.samples) : "–"),
    stat("Policy", t.version !== undefined ? t.version : "–"),
    stat("Training time", t.hours !== undefined ? t.hours.toFixed(1) + " h" : "–"),
    stat("Workers", `${data.worker_count} · ${Math.round(speed).toLocaleString()}/s`),
    stat("Last update", age(data.last_update_age) + " ago"),
    stat("Shards waiting", data.shards_waiting),
  ].join("");
}

function segment(id, key, number) {
  const el = document.getElementById(id);
  const mark = () => el.querySelectorAll("button").forEach(b => b.classList.toggle("on", String(prefs[key]) === b.dataset.v));
  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    prefs[key] = number ? Number(b.dataset.v) : b.dataset.v;
    save(); mark();
    if (key === "hours" || key === "focus") refresh(); else redraw();
  });
  mark();
}
segment("range", "hours", true);
segment("axis", "axis", false);
segment("smooth", "smooth", true);
segment("focus", "focus", false);

async function refresh() {
  try {
    const response = await fetch("/data?hours=" + prefs.hours + "&focus=" + (prefs.focus === "change" ? 1 : 0), {cache: "no-store"});
    data = await response.json();
    header(); side(); layout(); redraw();
  } catch (error) {
    const el = document.getElementById("state");
    el.textContent = "Cannot reach the dashboard script"; el.className = "pill stale";
  }
}
window.addEventListener("resize", () => { if (data) { layout(); redraw(); } });
refresh();
setInterval(refresh, 15000);
</script>
</body>
